services:

  client:
    build: ./client
    ports:
      - "80:80"
    depends_on:
      - backend

  python-service:
    build: ./routing_service
    ports:
    - "5000:5000"
  backend:
    build: ./server
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    depends_on:
      - mysql
      - mongodb

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: conempaques
      MYSQL_USER: prisma
      MYSQL_PASSWORD: prisma123
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  mongodb:
    image: mongo:7
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo123
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data:
