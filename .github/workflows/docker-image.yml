name: Monorepo Docker CI/CD

on:
  push:
    branches:
      - main
      - develop

jobs:
  detect-changes:
    runs-on: ubuntu-latest

    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      microservice: ${{ steps.filter.outputs.microservice }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'client/**'

            backend:
              - 'server/**'

            microservice:
              - 'routing_service/**'

  build-frontend:
    name: Build Frontend Image

    needs: detect-changes

    if: needs.detect-changes.outputs.frontend == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login into Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile

          push: true

          tags: |
            lacastrilf/conempaques:frontend
            lacastrilf/conempaques:frontend-${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-backend:
    name: Build Backend Image

    needs: detect-changes

    if: needs.detect-changes.outputs.backend == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login into Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile

          push: true

          tags: |
            lacastrilf/conempaques:backend
            lacastrilf/conempaques:backend-${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-microservice:
    name: Build Microservice Image

    needs: detect-changes

    if: needs.detect-changes.outputs.microservice == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login into Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Microservice
        uses: docker/build-push-action@v6
        with:
          context: ./routing_service
          file: ./routing_service/Dockerfile

          push: true

          tags: |
            lacastrilf/conempaques:microservice
            lacastrilf/conempaques:microservice-${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
